{% extends "base.html" %}
{% block title %}Register — Career Readiness{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="card-header">
            <h2 class="card-title">Create account</h2>
        </div>
        <div class="card-body">
            <form method="post" action="{{ url_for('register') }}" novalidate>
                <div class="form-group">
                    <label class="form-label" for="name">Full name</label>
                    <input class="form-input" type="text" id="name" name="name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
                    <span class="form-help">At least 6 characters.</span>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Register</button>
            </form>
            <p class="auth-alt">Have an account? <a href="{{ url_for('login') }}">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
