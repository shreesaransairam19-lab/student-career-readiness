{% extends "base.html" %}
{% block title %}Login — Career Readiness{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="card-header">
            <h2 class="card-title">Log in</h2>
        </div>
        <div class="card-body">
            <form method="post" action="{{ url_for('login') }}" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Log in</button>
            </form>
            <p class="auth-alt">No account? <a href="{{ url_for('register') }}">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
